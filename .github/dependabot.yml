# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule: 
    # Check for updates to GitHub Actions every month, each one will get its own unique PR
    interval: "monthly"
- package-ecosystem: "pip"
  directories:
  - "/metro-ai-suite/interactive-digital-avatar/requirements.txt"
  - "/metro-ai-suite/sensor-fusion-for-traffic-management/deployments/how_to_support_yolov6_model/requirements.txt"
  - "/metro-ai-suite/smart-nvr/requirements.txt"
  - "/metro-ai-suite/visual-search-question-and-answering/src/requirements.txt"
  - "/metro-ai-suite/interactive-digital-avatar/requirements.txt"
  - "/education-ai-suite/smart-classroom/requirements.txt"
  schedule:
    interval: "monthly"
  groups:
    archived-pypi:
      patterns:
        - "*"
- package-ecosystem: "npm"
  directories:
  - "/metro-ai-suite/image-based-video-search/src/app/package-lock.json"
  - "/•	education-ai-suite/smart-classroom/ui/package-lock.json "
  schedule:
    interval: "monthly"
  groups:
    archived-npm:
      patterns:
        - "*"
